<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="50%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1e40af" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Book Gradients -->
    <linearGradient id="leftPageGrad" x1="100%" y1="30%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="rightPageGrad" x1="0%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="underPageLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="underPageRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Gold Pen Gradients -->
    <linearGradient id="goldGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="goldGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <linearGradient id="penGripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow and Glow Filters -->
    <filter id="tipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="penShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />
  
  <!-- Ambient Center Glow -->
  <circle cx="256" cy="270" r="190" fill="url(#ambientGlow)" />

  <!-- === OPEN BOOK === -->
  <!-- Under Pages (Depth / Thickness) -->
  <path d="M 256 410 C 192 388 126 384 68 400 C 62 402 58 398 58 392 L 58 350 C 120 334 188 340 256 364 Z" fill="url(#underPageLeft)" />
  <path d="M 256 410 C 320 388 386 384 444 400 C 450 402 454 398 454 392 L 454 350 C 392 334 324 340 256 364 Z" fill="url(#underPageRight)" />

  <!-- Main Pages (Left & Right Wings) -->
  <!-- Left Page -->
  <path d="M 256 364 C 188 340 122 334 68 350 C 62 352 58 347 58 341 L 58 256 C 58 250 63 245 69 243 C 124 228 190 234 256 262 Z" fill="url(#leftPageGrad)" />
  <!-- Right Page -->
  <path d="M 256 364 C 324 340 390 334 444 350 C 450 352 454 347 454 341 L 454 256 C 454 250 449 245 443 243 C 388 228 322 234 256 262 Z" fill="url(#rightPageGrad)" />

  <!-- Book Spine Center Glow Line -->
  <path d="M 256 262 L 256 405" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" opacity="0.95" />

  <!-- Subtle Page Lines (Left Page) -->
  <path d="M 100 274 C 142 263 194 268 232 284" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <path d="M 96 302 C 140 291 194 296 232 312" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <path d="M 100 330 C 142 319 194 324 232 340" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Subtle Page Lines (Right Page) -->
  <path d="M 412 274 C 370 263 318 268 280 284" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.55" />
  <path d="M 416 302 C 372 291 318 296 280 312" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.55" />
  <path d="M 412 330 C 370 319 318 324 280 340" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- === FOUNTAIN PEN NIB (Dolma Kalem Ucu) === -->
  <g filter="url(#penShadow)">
    <!-- Pen Collar / Barrel Top -->
    <path d="M 212 72 L 300 72 L 292 118 L 220 118 Z" fill="url(#penGripGrad)" stroke="#475569" stroke-width="2.5" />
    <!-- Golden Metallic Ring -->
    <rect x="217" y="114" width="78" height="12" rx="3" fill="url(#goldGradRight)" />

    <!-- Left Half of Nib -->
    <path d="M 221 126 L 190 178 C 183 190 186 204 197 213 L 256 258 L 256 126 Z" fill="url(#goldGradLeft)" />
    
    <!-- Right Half of Nib (Highlight side) -->
    <path d="M 291 126 L 322 178 C 329 190 326 204 315 213 L 256 258 L 256 126 Z" fill="url(#goldGradRight)" />

    <!-- Nib Breather Hole & Center Slit -->
    <circle cx="256" cy="186" r="9" fill="#080c18" stroke="#854d0e" stroke-width="2" />
    <line x1="256" y1="195" x2="256" y2="258" stroke="#080c18" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Nib Engraving Details / Flourish -->
    <path d="M 214 172 C 234 196 245 186 247 165" stroke="#92400e" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M 298 172 C 278 196 267 186 265 165" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  </g>

  <!-- Luminous Magic Sparkle / Star at Pen Tip -->
  <g filter="url(#tipGlow)">
    <path d="M 256 244 Q 256 258 270 258 Q 256 258 256 272 Q 256 258 242 258 Q 256 258 256 244 Z" fill="#ffffff" />
    <circle cx="256" cy="258" r="4" fill="#ffffff" />
    <circle cx="256" cy="258" r="10" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Sparkle Accents -->
  <circle cx="165" cy="144" r="4" fill="#38bdf8" opacity="0.85" />
  <circle cx="348" cy="138" r="4.5" fill="#fde047" opacity="0.85" />
  <circle cx="376" cy="182" r="3" fill="#bae6fd" opacity="0.75" />
  <circle cx="138" cy="192" r="3.5" fill="#fef08a" opacity="0.75" />
</svg>