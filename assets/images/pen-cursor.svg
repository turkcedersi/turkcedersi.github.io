<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Contrast halo for dark backgrounds -->
  <path d="M2 28 L6 20 L20 6 L23 3 L26 6 L24 10 L10 24 Z" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Clicker button -->
  <path d="M20 6 L23 3 L26 6 L24 10 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Pen barrel (dynamic color) -->
  <path d="M6 20 L20 6 L24 10 L10 24 Z" fill="#dc2626" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Barrel 3D highlight -->
  <line x1="8" y1="19" x2="21" y2="6" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Clip -->
  <line x1="21" y1="8" x2="13" y2="16" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21" y1="8" x2="13" y2="16" stroke="#0f172a" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Cone tip (metallic silver) -->
  <path d="M2 28 L6 20 L10 24 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Accent ring -->
  <line x1="6" y1="20" x2="10" y2="24" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Ink ballpoint tip -->
  <circle cx="2.5" cy="27.5" r="1.2" fill="#dc2626"/>
</svg>
