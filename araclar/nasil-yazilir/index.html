<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nasıl Yazılır? | İnteraktif Yazım Kılavuzu & Bilgi Yarışması</title>
  
  <!-- Meta tags for SEO -->
  <meta name="description" content="Türkçede en çok karıştırılan sözcüklerin doğru yazılışlarını öğrenin. İnteraktif test, arama özelliği ve ilerleme kaydı ile Türkçe yazım kılavuzu.">
  <meta name="keywords" content="türkçe, yazım kuralları, nasıl yazılır, imla kılavuzu, karıştırılan sözcükler, tdk, yazım testi">
  <meta name="author" content="Ömer Geziciler">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Background Decorative Ambient Glows -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- App Wrapper -->
  <div class="app-container">
    
    <!-- Top Header Bar -->
    <header class="app-header glass">
      <div class="header-logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <div class="logo-text">
          <h1>Nasıl Yazılır<span>?</span></h1>
          <p>İnteraktif Yazım Rehberi</p>
        </div>
      </div>
      
      <!-- Search & Autocomplete Bar -->
      <div class="search-wrapper">
        <div class="search-box glass">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Sözcük ara... (örn: yalnız)" autocomplete="off">
          <button id="clear-search-btn" class="clear-search-btn" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="search-results" class="search-results-dropdown glass" style="display: none;"></div>
      </div>

      <!-- Quick Stats / Progress Summary -->
      <div class="header-actions">
        <button id="toggle-sidebar-btn" class="btn btn-icon glass mobile-only-btn" title="Menüyü Göster">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace Layout -->
    <main class="main-layout">
      
      <!-- Left Column: Quiz View -->
      <section class="quiz-section">
        <div class="quiz-card glass" id="quiz-card">
          
          <!-- Card Header Info -->
          <div class="card-header">
            <span class="question-number" id="question-index-label">Soru -- / --</span>
            <div class="card-badges">
              <span class="badge badge-difficulty" id="choice-count-badge">2 Seçenek</span>
              <span class="badge badge-status" id="question-status-badge">Yanıtlanmadı</span>
            </div>
          </div>
          
          <!-- Question Area -->
          <div class="question-body">
            <h2 class="question-prompt">Doğru yazılış hangisidir?</h2>
            
            <!-- Dynamic Choice Buttons Container -->
            <div class="choices-container" id="choices-container">
              <!-- JS will inject buttons here -->
            </div>
            
            <!-- Hint Box (Initially Hidden) -->
            <div class="hint-container glass" id="hint-container" style="display: none;">
              <span class="hint-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hint-icon">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="16" x2="12" y2="12"></line>
                  <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                Anlam / Açıklama:
              </span>
              <p class="hint-text" id="hint-text"></p>
            </div>
          </div>
          
          <!-- Card Footer Actions -->
          <div class="card-footer">
            <button id="prev-btn" class="btn btn-secondary glass" disabled>
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              Önceki
            </button>
            <button id="next-btn" class="btn btn-primary glass" disabled>
              Sonraki
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
          
        </div>
      </section>

      <!-- Right Column: Stats & Word Navigation Board -->
      <section class="sidebar-section glass" id="sidebar-panel">
        
        <!-- Sidebar Header with close button (Mobile) -->
        <div class="sidebar-header">
          <h3>İlerleme Tablosu</h3>
          <button id="close-sidebar-btn" class="btn btn-icon glass mobile-only-btn" title="Kapat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Progress Overview -->
        <div class="stats-overview">
          <div class="progress-bar-wrapper">
            <div class="progress-info">
              <span>Genel Başarı</span>
              <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-outer">
              <div class="progress-bar-inner" id="progress-fill" style="width: 0%;"></div>
            </div>
          </div>
          
          <!-- Counters Grid -->
          <div class="counters-grid">
            <div class="stat-box glass">
              <span class="stat-val" id="stat-total">0</span>
              <span class="stat-lbl">Tamamlanan</span>
            </div>
            <div class="stat-box glass success-stat">
              <span class="stat-val" id="stat-correct">0</span>
              <span class="stat-lbl">Doğru</span>
            </div>
            <div class="stat-box glass error-stat">
              <span class="stat-val" id="stat-incorrect">0</span>
              <span class="stat-lbl">Yanlış</span>
            </div>
          </div>
        </div>

        <!-- Dropdown Selector and Numeric Input Jump -->
        <div class="navigation-controls">
          <div class="control-group">
            <label for="question-select" class="control-label">Sorular Listesi</label>
            <div class="select-wrapper">
              <select id="question-select" class="glass-select">
                <!-- JS will populate options dynamically -->
              </select>
              <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
          
          <div class="control-group">
            <label for="jump-input" class="control-label">Soru Numarası Yaz ve Git</label>
            <div class="jump-box">
              <input type="number" id="jump-input" class="glass-input" min="1" placeholder="Örn: 42">
              <button id="jump-btn" class="btn btn-primary glass">Git</button>
            </div>
          </div>
        </div>


      </section>

    </main>
  </div>

  <!-- Load Global Slide Data -->
  <script src="words.js"></script>
  <!-- Load App Controller Logic -->
  <script src="app.js"></script>
</body>
</html>
